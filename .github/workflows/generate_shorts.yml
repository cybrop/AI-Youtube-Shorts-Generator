name: Generate Shorts

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      mode:
        description: 'Execution Mode (local or api)'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - api
      num_clips:
        description: 'Number of clips to generate'
        required: true
        default: '3'

jobs:
  run-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg)
        if: ${{ inputs.mode == 'local' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ inputs.mode }}" = "local" ]; then
            pip install -r requirements-local.txt
          fi
          pip install -U yt-dlp

      - name: Setup YouTube Cookies and Patch yt-dlp Options
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            echo "cookies.txt created."
          fi

          # Patch yt_dlp options in the codebase to use cookies and mobile client spoofing
          python -c '
          import os, glob

          cookie_arg = "cookies.txt" if os.path.exists("cookies.txt") else None

          for root, _, files in os.walk("."):
              for file in files:
                  if file.endswith(".py"):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()
                      if "YoutubeDL(" in content:
                          print(f"Patching {path}")
                          old = "YoutubeDL(ydl_opts)" if "YoutubeDL(ydl_opts)" in content else "YoutubeDL({"
                          if "ydl_opts" in content:
                              patch = (
                                  "ydl_opts.setdefault(\"cookiefile\", \"cookies.txt\"); "
                                  "ydl_opts.setdefault(\"extractor_args\", {\"youtube\": {\"player_client\": [\"ios\", \"android\", \"web\"]}}); "
                              )
                              content = content.replace("with yt_dlp.YoutubeDL(ydl_opts)", patch + "with yt_dlp.YoutubeDL(ydl_opts)")
                              content = content.replace("with YoutubeDL(ydl_opts)", patch + "with YoutubeDL(ydl_opts)")
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(content)
          '

      - name: Run Shorts Generator
        env:
          MUAPI_API_KEY: ${{ secrets.MUAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: 'gemini'
          GEMINI_MODEL: 'gemini-2.5-flash'
          LOCAL_WHISPER_MODEL: 'base'
          LOCAL_OUTPUT_DIR: 'output'
        run: |
          python main.py "${{ inputs.youtube_url }}" \
            --mode ${{ inputs.mode }} \
            --num-clips ${{ inputs.num_clips }}

      - name: Upload Generated Shorts
        if: ${{ inputs.mode == 'local' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: output/*.mp4
