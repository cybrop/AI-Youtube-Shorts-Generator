name: Generate Shorts

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      mode:
        description: 'Execution Mode (local or api)'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - api
      num_clips:
        description: 'Number of clips to generate'
        required: true
        default: '3'

jobs:
  run-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg)
        if: ${{ inputs.mode == 'local' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ inputs.mode }}" = "local" ]; then
            pip install -r requirements-local.txt
          fi
          pip install -U yt-dlp

      - name: Setup YouTube Cookies and Configure Downloader
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            echo "cookies.txt created."
          fi

          python -c '
          import os

          target = "shorts_generator/local/downloader.py"
          if os.path.exists(target):
              with open(target, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              new_lines = []
              for line in lines:
                  if "with yt_dlp.YoutubeDL(ydl_opts)" in line or "with YoutubeDL(ydl_opts)" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      new_lines.append(f"{indent}if os.path.exists(\"cookies.txt\"):\n")
                      new_lines.append(f"{indent}    ydl_opts[\"cookiefile\"] = \"cookies.txt\"\n")
                      new_lines.append(f"{indent}ydl_opts.setdefault(\"extractor_args\", {{}}).setdefault(\"youtube\", {{}})[\"player_client\"] = [\"ios\", \"android\", \"web\"]\n")
                  new_lines.append(line)

              with open(target, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)
              print("Successfully injected yt-dlp settings.")
          '

      - name: Run Shorts Generator
        env:
          MUAPI_API_KEY: ${{ secrets.MUAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: 'gemini'
          GEMINI_MODEL: 'gemini-2.5-flash'
          LOCAL_WHISPER_MODEL: 'base'
          LOCAL_OUTPUT_DIR: 'output'
        run: |
          python main.py "${{ inputs.youtube_url }}" \
            --mode ${{ inputs.mode }} \
            --num-clips ${{ inputs.num_clips }}

      - name: Upload Generated Shorts
        if: ${{ inputs.mode == 'local' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: output/*.mp4
