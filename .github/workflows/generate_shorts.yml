- name: Setup YouTube Cookies
        if: ${{ secrets.YOUTUBE_COOKIES != '' }}
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Run Shorts Generator
        env:
          MUAPI_API_KEY: ${{ secrets.MUAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: 'gemini'
          GEMINI_MODEL: 'gemini-2.5-flash'
          LOCAL_WHISPER_MODEL: 'base'
          LOCAL_OUTPUT_DIR: 'output'
        run: |
          COOKIE_ARG=""
          if [ -f cookies.txt ]; then
            COOKIE_ARG="--cookies cookies.txt"
          fi
          python main.py "${{ inputs.youtube_url }}" \
            --mode ${{ inputs.mode }} \
            --num-clips ${{ inputs.num_clips }} $COOKIE_ARG
